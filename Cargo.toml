[package]
name = "proj-janitor"
version = "0.2.1"
edition = "2024"
description = "Scan, back up, restore, and clean old projects safely"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/TangCan/proj-janitor"
repository = "https://github.com/TangCan/proj-janitor"
documentation = "https://docs.rs/proj-janitor"
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**", "tests/rust_cli.rs"]

[[bin]]
name = "projjan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1"
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
walkdir = "2.5"
url = "2.5"
