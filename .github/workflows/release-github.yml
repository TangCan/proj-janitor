name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z or python-vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Render notes without creating the release
        default: true
        required: true
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        default: false
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Render release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/github_release_notes.py --tag "$TAG" --output "$RUNNER_TEMP/notes.md"
          case "$TAG" in
            python-v*) title="proj-janitor Python ${TAG#python-v}" ;;
            v*) title="proj-janitor ${TAG#v}" ;;
            *) echo "unsupported tag: $TAG" >&2; exit 2 ;;
          esac
          echo "TITLE=$title" >> "$GITHUB_ENV"
      - name: Preview notes
        if: inputs.dry_run
        run: cat "$RUNNER_TEMP/notes.md"
      - name: Create or update release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: scripts/create_github_release.sh "$TAG" "$RUNNER_TEMP/notes.md" "$TITLE"
