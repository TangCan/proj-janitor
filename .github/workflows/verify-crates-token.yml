name: Verify crates.io token

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check crates.io token presence
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "error: CARGO_REGISTRY_TOKEN repository secret is not configured" >&2
            exit 1
          fi
          case "${CARGO_REGISTRY_TOKEN}" in
            cio*) ;;
            *) echo "warning: token does not start with 'cio'; check the crates.io token value" >&2 ;;
          esac
          echo "token present (crates.io has no non-mutating introspection API; validity is confirmed on the first publish)"
