name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: ubuntu-24.04
            python-version: "3.15"
          - os: macos-15
            python-version: "3.12"
          - os: macos-15
            python-version: "3.15"
          - os: windows-2025
            python-version: "3.12"
          - os: windows-2025
            python-version: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.10'
        name: Build and install Python wheel on minimum supported version
        run: |
          wheel_dir="${RUNNER_TEMP}/proj-janitor-wheel"
          install_dir="${RUNNER_TEMP}/proj-janitor-install"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          python -m pip install --no-deps --target "$install_dir" "$wheel_dir"/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$install_dir" "$install_dir/bin/projjan" --version

  python-build-audit:
    name: Python build dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Export declared build requirements
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          requirements = tomllib.loads(Path("pyproject.toml").read_text())["build-system"]["requires"]
          Path(os.environ["RUNNER_TEMP"], "build-requirements.txt").write_text("\n".join(requirements) + "\n")
          PY
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ${{ runner.temp }}/build-requirements.txt

  workflow-lint:
    name: GitHub Actions workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint"'

  rust:
    name: Rust stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --nocapture
      - if: matrix.os == 'ubuntu-24.04'
        run: cargo package --locked

  rust-msrv:
    name: Rust MSRV 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.88.0
      - run: cargo test --locked
      - run: cargo package --locked

  rustsec-audit:
    name: Rust dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit locked dependencies
        run: cargo audit

  cross-version-compat:
    name: Python and Rust archive compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - run: cargo build --locked --release
      - run: python tests/cross_version_compat.py target/release/projjan
